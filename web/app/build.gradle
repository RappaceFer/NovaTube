plugins { id "com.android.application" }

def ks = new Properties()
def ksFile = rootProject.file("keystore.properties")
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace = "com.rappace.novatube.web"
    compileSdk = 37
    defaultConfig {
        applicationId = "com.rappace.novatube.web"
        minSdk = 26
        targetSdk = 34
        versionCode = 2
        versionName = "1.1"
        ndk { abiFilters.add("armeabi-v7a") }
    }
    signingConfigs {
        rappace {
            storeFile = file(ks["storeFile"])
            storePassword = ks["storePassword"]
            keyAlias = ks["keyAlias"]
            keyPassword = ks["keyPassword"]
        }
    }
    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = signingConfigs.rappace
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging = true } }
}

dependencies {
    implementation "org.mozilla.geckoview:geckoview:${project.property('geckoVersion')}"
}
